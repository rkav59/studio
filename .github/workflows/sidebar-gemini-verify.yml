name: Sidebar and Gemini validation

on:
  push:
    branches:
      - feat/sidebar-gemini-migration-audit
  pull_request:
    branches:
      - feat/pause-subscriptions-free-access

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
