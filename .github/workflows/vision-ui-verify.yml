name: Vision UI dashboard verification

on:
  push:
    branches:
      - feat/vision-mui-dashboard

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vision-mui-dashboard
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Synchronize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: synchronize MUI v5 dependency lockfile"
            git push origin HEAD:feat/vision-mui-dashboard
          fi
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test
