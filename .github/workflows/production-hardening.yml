name: Production Hardening

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: production-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify Firebase rules are version-controlled
        run: |
          test -f firestore.rules
          test -f storage.rules
          grep -q '"firestore"' firebase.json
          grep -q '"storage"' firebase.json
